<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AwareLiquid MVP Demo</title>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 320px; background: #131b2e; border-right: 1px solid #1e293b; padding: 24px; display: flex; flex-direction: column; }
        .sidebar h1 { font-size: 20px; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; margin-top: 0; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .sidebar h1 span { background: #38bdf8; width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #38bdf8; }
        
        .metric { background: #0b0f19; border: 1px solid #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .metric-title { font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 24px; font-weight: bold; color: #f8fafc; font-family: monospace; }
        
        .entropy-bar-bg { background: #1e293b; height: 6px; border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .entropy-bar-fg { background: #22c55e; height: 100%; width: 15%; transition: all 0.3s ease; }
        .entropy-bar-fg.high { background: #ef4444; width: 85%; }
        
        .main { flex: 1; display: flex; flex-direction: column; }
        .chat-container { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; }
        
        .message { margin-bottom: 24px; max-width: 80%; display: inline-block; padding: 14px 20px; border-radius: 12px; line-height: 1.5; font-size: 15px; }
        .message.user { align-self: flex-end; background: #38bdf8; color: #0f172a; border-bottom-right-radius: 2px; }
        .message.bot { align-self: flex-start; background: #1e293b; color: #f1f5f9; border-bottom-left-radius: 2px; }
        .message.system { align-self: center; background: rgba(239, 68, 68, 0.1); color: #fca5a5; font-family: monospace; font-size: 13px; text-transform: uppercase; border: 1px solid rgba(239, 68, 68, 0.2); margin: 30px 0; max-width: 100%; }
        .message.system.cloud { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); }
        
        .input-bar { padding: 20px 40px; border-top: 1px solid #1e293b; background: #0b0f19; }
        .input-box { width: 100%; background: #131b2e; border: 1px solid #1e293b; border-radius: 18px; padding: 16px 20px; color: #f1f5f9; font-size: 15px; outline: none; box-sizing: border-box; font-family: inherit; }
        
        .blinking-cursor::after { content: '▋'; animation: blink 1s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        .typing { display: flex; gap: 4px; align-items: center; justify-content: center; height: 20px; }
        .typing span { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Layer 3 — Reasoning timeline */
        .timeline { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; font-family: monospace; font-size: 11px; }
        .tl-row { display: grid; grid-template-columns: 32px 1fr 48px; gap: 8px; padding: 4px 6px; border-radius: 4px; background: rgba(15,23,42,0.6); }
        .tl-row .step { color: #64748b; }
        .tl-row .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tl-row .metric { text-align: right; color: #94a3b8; }
        .tl-row.local { border-left: 3px solid #22c55e; }
        .tl-row.cloud { border-left: 3px solid #38bdf8; color: #bae6fd; }
        .tl-row.inject { border-left: 3px solid #a78bfa; color: #ddd6fe; }
        .tl-row.revise { border-left: 3px solid #f59e0b; color: #fde68a; }
    </style>
</head>
<body>

<div class="sidebar">
    <h1><span></span> AwareLiquid Edge</h1>

    <div class="metric">
        <div class="metric-title">Active Model</div>
        <div class="metric-value" style="font-size: 16px; color:#38bdf8">AwareLiquid-0.5B</div>
    </div>

    <div class="metric">
        <div class="metric-title">Live Entropy</div>
        <div class="metric-value" id="entropy-val">1.25 H</div>
        <div class="entropy-bar-bg"><div class="entropy-bar-fg" id="entropy-bar"></div></div>
    </div>

    <div class="metric">
        <div class="metric-title">Capsule Memory State</div>
        <div class="metric-value" id="capsule-val">O(1) \ 4.1 KB</div>
    </div>

    <div class="metric">
        <div class="metric-title">Oracle Router Link</div>
        <div class="metric-value" id="router-val" style="color: #94a3b8; font-size: 16px;">STANDBY</div>
    </div>

    <div class="metric">
        <div class="metric-title">Reasoning Timeline (Layer 3)</div>
        <div class="timeline" id="timeline"></div>
    </div>
</div>

<div class="main">
    <div class="chat-container" id="chat">
        <div class="message bot">Hello! I am running entirely on local state (4.1KB capsule). How can I help you?</div>
    </div>
    <div class="input-bar">
        <input type="text" class="input-box" id="user-input" placeholder="Type a message..." autocomplete="off">
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('user-input');
    const entropyVal = document.getElementById('entropy-val');
    const entropyBar = document.getElementById('entropy-bar');
    const routerVal = document.getElementById('router-val');
    const capsuleVal = document.getElementById('capsule-val');
    const timeline = document.getElementById('timeline');

    let traceStep = 0;
    function traceEvent(route, label, metric) {
        traceStep += 1;
        const row = document.createElement('div');
        row.className = 'tl-row ' + route;
        row.innerHTML = `<span class="step">#${String(traceStep).padStart(2,'0')}</span>` +
                        `<span class="label">${label}</span>` +
                        `<span class="metric">${metric || ''}</span>`;
        timeline.appendChild(row);
        timeline.scrollTop = timeline.scrollHeight;
    }
    
    function addMsg(cls, text) {
        const d = document.createElement('div');
        d.className = 'message ' + cls;
        d.innerHTML = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
    }
    
    function setTyping(active) {
        if (active) {
            const d = document.createElement('div');
            d.className = 'message bot typing-indicator';
            d.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        } else {
            const els = document.querySelectorAll('.typing-indicator');
            els.forEach(e => e.remove());
        }
    }
    
    window.startDemo = async function() {
        const query = "Explain the origins of m-theory to me.";
        await sleep(1000);
        
        let typeStr = "";
        for(let c of query) {
            typeStr += c;
            input.value = typeStr;
            await sleep(60);
        }
        await sleep(500);
        input.value = '';
        addMsg('user', query);
        setTyping(true);
        
        // Spike entropy after 1 second
        await sleep(1000);
        traceEvent('local', 'prefill query', 'E=1.2');
        traceEvent('local', 'decode local', 'E=1.4');
        traceEvent('local', 'decode local', 'E=2.1');
        entropyVal.textContent = '8.94 H (CRITICAL)';
        entropyVal.style.color = '#ef4444';
        entropyBar.className = 'entropy-bar-fg high';
        traceEvent('revise', 'entropy spike', 'E=8.9');

        await sleep(500);
        setTyping(false);
        addMsg('system', '⚠ HALLUCINATION RISK DETECTED: ENTROPY THRESHOLD EXCEDED. HALTING EDGE INFERENCE.');

        await sleep(1500);
        routerVal.textContent = 'UPLINK ACTIVE';
        routerVal.style.color = '#38bdf8';
        addMsg('system cloud', '☁ ROUTING QUERY TO CLOUD ORACLE...');
        traceEvent('cloud', 'cloud query: m-theory', 'gemini');

        await sleep(2000);
        routerVal.textContent = 'DOWNLOADING STATE';
        addMsg('system cloud', '☁ RECEIVING COMPRESSED KV-FACTS...');
        traceEvent('inject', 'quiet inject 187B', 'Φ↑');

        await sleep(1000);
        routerVal.textContent = 'STANDBY';
        routerVal.style.color = '#94a3b8';

        capsuleVal.textContent = 'O(1) \\ 4.2 KB (UPDATED)';
        capsuleVal.style.color = '#22c55e';
        entropyVal.textContent = '1.02 H';
        entropyVal.style.color = '#f8fafc';
        entropyBar.className = 'entropy-bar-fg';

        addMsg('system', '✓ KNOWLEDGE ABSORBED INTO LOCAL CAPSULE. RESUMING DECODING.');
        setTyping(true);
        traceEvent('local', 'resume decode', 'E=1.0');
        
        await sleep(1500);
        setTyping(false);
        
        // Type out answer
        const ans = "M-theory is a framework in physics unifying all consistent versions of superstring theory. First proposed by Edward Witten in 1995, it posits that there are 11 dimensions in spacetime. My local capsule state has now been permanently updated with this fact, saving cloud API costs for future queries.";
        const d = addMsg('bot', '<span class="blinking-cursor"></span>');
        
        let outStr = "";
        for(let i=0; i<ans.length; i+=3) {
            outStr += ans.substring(i, i+3);
            d.innerHTML = outStr + '<span class="blinking-cursor"></span>';
            chat.scrollTop = chat.scrollHeight;
            await sleep(30);
        }
        d.innerHTML = outStr;
        
        await sleep(2000);
        window._demoDone = true;
    };
    
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    
</script>
</body>
</html>
