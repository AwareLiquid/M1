[pytest]
# Project uses sys.path insertion (no packaging), so tests live under tests/.
testpaths = tests
addopts = -ra --strict-markers --strict-config

# Forward-looking markers for the slow/integration split (item 3 of the test
# hardening pass). Registering them keeps `--strict-markers` honest and lets
# `pytest -m "not slow"` give a fast inner-loop run.
markers =
    slow: long-running test; deselect with -m "not slow"
    integration: end-to-end test spanning multiple modules

# Centralize the one piece of pure environment noise (Tensor-Core alignment
# hint from non-multiple-of-8 protofilament einsums) that several test files
# were each silencing by hand. Real signals -- e.g. torch.jit TracerWarning --
# are deliberately left visible.
filterwarnings =
    ignore:.*Tensor Cores.*:RuntimeWarning
    # 归档负结果模块(见 config._ARCHIVED_NEGATIVE_MODULES):行为契约测试
    # (test_predictive_coding_loss / test_rhythm)需显式开启以验证代码路径,
    # 归档警告在此静音;警告的功能性由 test_archived_negative_modules.py
    # 用 pytest.warns 独立断言,不受本规则影响。
    ignore:.*\[archived-negative\].*:UserWarning
