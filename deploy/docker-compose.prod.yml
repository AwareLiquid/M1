# Production deployment: MT-LNN inference server behind a Caddy TLS reverse proxy.
#
# This is the public go-live stack for awareliquid.ai. It runs two containers:
#   - mtlnn : the FastAPI inference server (CPU), built from the repo-root Dockerfile.
#   - caddy : terminates HTTPS for the domain and proxies to mtlnn:8000.
#
# Prereqs on the host (see deploy/DEPLOY_VULTR.md):
#   1. Docker + docker compose plugin installed.
#   2. DNS A records for awareliquid.ai AND www.awareliquid.ai -> this host's IP.
#   3. Ports 80 and 443 open in the Vultr firewall / ufw.
#   4. The trained checkpoint at ./checkpoints/m2_final.pt (the slim serve.pt from
#      the Kaggle M2 run, renamed). The server runs a FRESH untrained model until
#      this file exists -- drop it in and `docker compose ... restart mtlnn`.
#
# Bring up:   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Logs:       docker compose -f deploy/docker-compose.prod.yml logs -f
# Reload ckpt:docker compose -f deploy/docker-compose.prod.yml restart mtlnn
# Tear down:  docker compose -f deploy/docker-compose.prod.yml down
#
# Run this from the REPO ROOT (build context `..` resolves the Dockerfile + code).

services:
  mtlnn:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mtlnn:latest
    container_name: mtlnn_prod
    restart: unless-stopped
    expose:
      - "8000"                       # internal only; Caddy is the public edge
    volumes:
      - ../checkpoints:/app/checkpoints:ro
    environment:
      CKPT_PATH: /app/checkpoints/m2_final.pt
      TOKENIZER: gpt2
      DEVICE: cpu
      MAX_NEW_TOKENS_CAP: "512"
      # Cap intra-op threads to the box's physical cores for steady latency.
      OMP_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # The MT-LNN ADAPTER model: a frozen instruct base (TinyLlama-1.1B-Chat) +
  # AwareLiquid's TRAINED MT-LNN residual adapter + LoRA, served through
  # serve/server_hf.py with the SAME REST API + UI. This is genuinely MT-LNN-
  # powered (server_hf.py refuses to claim the MT-LNN identity unless the
  # checkpoint tensors actually map onto the graph) and is the validated Track-1
  # asset (-28.5% PPL on TinyLlama-1.1B). The frontend model menu can target it.
  #
  # Profile-gated so it never auto-starts (it pulls ~4 GB of base weights and
  # adds RAM load -- size your box for ~8 GB if running it alongside mtlnn).
  # Launch explicitly:
  #   docker compose -f deploy/docker-compose.prod.yml --profile adapter up -d adapter
  # Try it directly on the box (bound to localhost):
  #   curl -X POST localhost:8001/v1/completions -H 'content-type: application/json' \
  #        -d '{"prompt":"Tell me a short story about a robot.","max_new_tokens":80}'
  adapter:
    image: mtlnn:latest                # reuse the already-built image (transformers + peft)
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mtlnn_adapter
    restart: unless-stopped
    profiles: ["adapter"]
    command: ["uvicorn", "serve.server_hf:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8001:8000"          # localhost only; Caddy routes /adapter/* to it internally
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - hf_cache:/app/.hf_cache        # persist the downloaded base-model weights
    environment:
      BASE_MODEL: TinyLlama/TinyLlama-1.1B-Chat-v1.0
      ADAPTER_CKPT: /app/checkpoints/llama_mt_adapter/llama_mt_adapter_001000.pt
      RECIPE: phase5b                  # MT adapters + LoRA, matching the checkpoint
      DEVICE: cpu
      MAX_NEW_TOKENS_CAP: "512"
      OMP_NUM_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 180s               # first start downloads the base model
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: caddy_prod
    restart: unless-stopped
    depends_on:
      - mtlnn
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # persists the issued TLS certs across restarts
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  hf_cache:                            # cached base-model weights for the baseline service
